name: Build SideInstaller (No Wi-Fi)

# Builds an unsigned IPA from the upstream sources with no-wifi.patch applied
# (pairing with Wi-Fi off). The sources stay identical to FrizzleM/SideInstaller,
# so "Sync fork" keeps working; the patches are applied at build time and the
# run stops if upstream has changed the lines they touch.
#
# SideInstaller is developed on Xcode 27.1. GitHub's macOS runners don't have
# Xcode 27 yet, so where it's missing the newest Xcode 26 builds it, with
# xcode26.patch applied as well.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (a GitHub image, or a self-hosted Mac)"
        required: false
        default: macos-26
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          app="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$app" ]; then
            app="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
            if [ -z "$app" ]; then
              echo "::error::No Xcode 26 or 27 on this runner."
              exit 1
            fi
            echo "XCODE26=1" >> "$GITHUB_ENV"
            echo "MIN_IOS_SDK=26.0" >> "$GITHUB_ENV"
            echo "::notice::No Xcode 27 on this runner: building with $(basename "$app") and xcode26.patch."
          fi
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version

      - name: Apply patches
        shell: bash
        run: |
          git apply --check -v no-wifi.patch
          git apply no-wifi.patch
          if [ "${XCODE26:-0}" = 1 ]; then
            git apply --check -v xcode26.patch
            git apply xcode26.patch
          fi
          git --no-pager diff --stat

      - name: Install Rust target and XcodeGen
        shell: bash
        run: |
          rustup target add aarch64-apple-ios
          command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build unsigned IPA
        shell: bash
        run: bash scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-NoWiFi-IPA
          path: build/SideInstaller.ipa
          if-no-files-found: error
