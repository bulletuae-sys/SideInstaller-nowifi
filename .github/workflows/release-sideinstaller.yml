name: Build SideInstaller (No Wi-Fi)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target and XcodeGen
        run: |
          rustup target add aarch64-apple-ios
          brew install xcodegen

      - name: Fix Code and Bypass Wi-Fi & SDK Restrictions
        run: |
          python3 - << 'EOF'
          import glob, os

          # 1. إصلاح وتجاوز قيود الـ Wi-Fi في ملفات الـ Swift
          for path in glob.glob("ios-app/*.swift"):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()

              code = code.replace("path.usesInterfaceType(.wifi)", "true")
              code = code.replace("@Published private(set) var isOnWiFi: Bool = false", "@Published private(set) var isOnWiFi: Bool = true")
              code = code.replace("self?.isOnWiFi = onWiFi", "self?.isOnWiFi = true")
              code = code.replace("!networkStatus.isOnWiFi", "false")
              code = code.replace("networkStatus.isOnWiFi", "true")
              
              # تصحيح صياغة واجهات الشبكة لتتطابق نحوياً مع Swift
              code = code.replace('$0.name == "en0", "utun0", "utun1", "utun2", "utun3", "utun4", "lo0"', '$0.name == "en0" || $0.name.hasPrefix("utun")')
              code = code.replace('$0.name != "en0", "utun0", "utun1", "utun2", "utun3", "utun4", "lo0"', '$0.name != "en0"')

              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)

          # 2. معالجة الدوال الخاصة بـ iOS 27 غير الموجودة في SDK 18.5
          install_path = "ios-app/InstallActivity.swift"
          if os.path.exists(install_path):
              with open(install_path, "r", encoding="utf-8") as f:
                  ic = f.read()
              # تحويل استدعاءات الخلفية غير المتوافقة إلى أكواد فارغة آمنة أثناء البناء
              ic = ic.replace("BGContinuedProcessingTask", "Any")
              ic = ic.replace("BGContinuedProcessingTaskRequest", "Any")
              with open(install_path, "w", encoding="utf-8") as f:
                  f.write(ic)

          route_path = "ios-app/RoutePlanner.swift"
          if os.path.exists(route_path):
              with open(route_path, "r", encoding="utf-8") as f:
                  rc = f.read()
              rc = rc.replace("MKReverseGeocodingRequest", "CLGeocoder")
              with open(route_path, "w", encoding="utf-8") as f:
                  f.write(rc)

          print("Successfully patched all files for Xcode 16.4 / iOS 18.5 SDK!")
          EOF

      - name: Build unsigned IPA
        run: |
          chmod +x build-rust.sh scripts/build-ipa.sh scripts/export-ipa.sh
          ./scripts/build-ipa.sh
          ls -la

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-NoWiFi-IPA
          path: |
            *.ipa
            build/*.ipa
