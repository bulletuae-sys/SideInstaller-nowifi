name: Build SideInstaller (No Wi-Fi)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target and XcodeGen
        run: |
          rustup target add aarch64-apple-ios
          brew install xcodegen

      - name: Bypass Wi-Fi Requirement in Swift Code
        run: |
          python3 - << 'EOF'
          import glob

          for path in glob.glob("ios-app/*.swift"):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()

              # 1. جعل NetworkStatus يعتبر الـ Wi-Fi متصلاً دائماً
              code = code.replace("path.usesInterfaceType(.wifi)", "true")
              code = code.replace("@Published private(set) var isOnWiFi: Bool = false", "@Published private(set) var isOnWiFi: Bool = true")
              code = code.replace("self?.isOnWiFi = onWiFi", "self?.isOnWiFi = true")

              # 2. إيقاف أي حظر للتثبيت أو الـ Pairing في الواجهة
              code = code.replace("!networkStatus.isOnWiFi", "false")
              code = code.replace("networkStatus.isOnWiFi", "true")

              # 3. السماح بواجهات النفق المحلي (utun) بجانب en0
              code = code.replace('"en0"', '"en0", "utun0", "utun1", "utun2", "utun3", "utun4", "lo0"')

              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)
          print("Successfully patched all Swift files!")
          EOF

      - name: Build unsigned IPA
        run: |
          chmod +x build-rust.sh scripts/build-ipa.sh scripts/export-ipa.sh
          ./scripts/build-ipa.sh
          ls -la

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-NoWiFi-IPA
          path: |
            *.ipa
            build/*.ipa
