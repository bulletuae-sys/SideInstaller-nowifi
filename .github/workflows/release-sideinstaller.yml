name: Build SideInstaller (No Wi-Fi)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target and XcodeGen
        run: |
          rustup target add aarch64-apple-ios
          brew install xcodegen

      - name: Bypass Wi-Fi and SDK Version Check
        run: |
          python3 - << 'EOF'
          import glob, os

          # 1. تعديل ملفات Swift لتجاوز فحص الـ Wi-Fi والشبكة
          for path in glob.glob("ios-app/*.swift"):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()

              code = code.replace("path.usesInterfaceType(.wifi)", "true")
              code = code.replace("@Published private(set) var isOnWiFi: Bool = false", "@Published private(set) var isOnWiFi: Bool = true")
              code = code.replace("self?.isOnWiFi = onWiFi", "self?.isOnWiFi = true")
              code = code.replace("!networkStatus.isOnWiFi", "false")
              code = code.replace("networkStatus.isOnWiFi", "true")
              code = code.replace('"en0"', '"en0", "utun0", "utun1", "utun2", "utun3", "utun4", "lo0"')

              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)

          # 2. تعديل ملفات فحص الأخطاء أو السكريبتات التي تمنع إصدار SDK القديم
          for path in glob.glob("ios-app/*.swift") + glob.glob("scripts/*.sh") + glob.glob("*.sh"):
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  # خفض أو إلغاء شرط متطلبات الإصدار العالي
                  content = content.replace("27.1", "18.0").replace("27.2", "18.0").replace("27.0", "18.0")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)

          print("Successfully bypassed SDK and Wi-Fi checks!")
          EOF

      - name: Build unsigned IPA
        run: |
          chmod +x build-rust.sh scripts/build-ipa.sh scripts/export-ipa.sh
          ./scripts/build-ipa.sh
          ls -la

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-NoWiFi-IPA
          path: |
            *.ipa
            build/*.ipa
